# yaml-language-server: $schema=./agent.schema.json
name: docs-gap
description: "Docs Gap — finds a hole in Stream docs, checks the official page and the code, then opens a GitHub PR or a Linear issue (human must say yes)."
mode: text
llm: llm-fast

# Catalog connectors (hosted MCP). A name-only entry is a session login —
# the agent asks you to connect GitHub in the chat.
# After Library → Connectors has a shared GitHub login labelled "company",
# set connection: company on github so every session uses that one.
connectors:
  - name: github
    connector: github
    connection: company
    required: true
  - name: linear
    connector: linear
  - name: slack
    connector: slack

# Extra MCP servers (not the catalog). Add a URL only when we have a real one.
# mcp_servers:
#   - name: stream-docs
#     url: https://example.com/mcp
